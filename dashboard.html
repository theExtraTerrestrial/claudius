     land. So there is exactly one interactive element here, and it is optional:
     the code field. Everything else is a link to open and a state to report.

     The panel never decides that a sign-in worked. Only the sidecar does, from
     the filesystem, and only its terminal state is trusted — which is also why
     the profile list is not reloaded until then.

     Signing an EXISTING account in again (`kind:"relogin"`) is the same job with
     a different ending, so it is the same panel: same states, same code channel,
     same cancel. Only three things differ and each is spelled out where it
     happens — there is no name to choose, there is no account to switch to, and
     a failure changes nothing rather than leaving nothing behind.
     ═══════════════════════════════════════════════════════════════════════ */
  const ADD_IDLE = { state:"idle", kind:"add", id:null, name:"", url:null,
                     needsCode:false, log:"", error:null, activate:false, busy:false };
  let ADD = { ...ADD_IDLE };
  let addPollT = null;
  const ADD_LIVE = ["running","stopping"];

  /* Mirrors the sidecar's valid_profile_name?, which mirrors the CLI's
     sanitize_profile_name. Three copies is two too many, but the alternative is a
     round trip before the first keystroke is judged — so the rule is stated in
     one line in each place and tested in two. */
  const addNameOK = n => /^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(n) && n.length <= 64;
  function addNameProblem(n){
    if (!n) return "";
    if (!addNameOK(n)) return "letters, digits, dot, dash and underscore only";
    if (PROFILES.some(p => p.name === n)) return `${n} already exists`;
    return "";
  }

  const addRelog = () => ADD.kind === "relogin";

  /* The panel shows the end of a subprocess's output, and a blind slice lands
     wherever the character count falls — mid-URL, so the box opens on `com)` and
     reads as garbage before it reads as a log. Cut on a line boundary instead:
     drop the partial first line whenever there is a whole one behind it, and keep
     the raw slice when there isn't (one line longer than the window has no
     boundary to cut on, and half of it beats none of it). */
  const TAIL_MAX = 600;
  function logTail(s){
    if (s.length <= TAIL_MAX) return s;
    const cut = s.slice(-TAIL_MAX), nl = cut.indexOf("\n");
    return nl >= 0 && nl < cut.length - 1 ? cut.slice(nl + 1) : cut;
  }

  function addHTML(){
    if (ADD.state === "idle")
      return `<button class="addcard" data-add="open">
        <span class="ms">add</span>add an account</button>`;
    /* No name step for a relogin: the account already has one, and it is the one
       thing about it that must NOT change. What is left is a confirmation, which
       is worth showing rather than skipping — a sign-in opens a browser tab and
       takes over the profile's credential, so it should be asked for twice. */
    if (ADD.state === "naming" && addRelog()){
      return `<div class="addpanel">
        <div class="ahd"><span class="ms">login</span>sign in again
          <button class="icobtn x" data-add="close" title="close"
            aria-label="close"><span class="ms">close</span></button></div>
        <div class="hint">You'll sign in with Anthropic in a new tab, for
          <b>${esc(ADD.name)}</b>. It keeps its name, its history and its settings —
          only the credential that expired is replaced.</div>
        <div class="hint">Sign in with the <b>same Anthropic account</b> as before,
          or this profile changes identity.</div>
        <div class="row"><button class="go" data-add="start"
          ><span class="ms">login</span>Start sign-in</button></div>
      </div>`;
    }
    if (ADD.state === "naming"){
      const problem = addNameProblem(ADD.name);
      const ready = ADD.name && !problem;
      return `<div class="addpanel">
        <div class="ahd"><span class="ms">add</span>new account
          <button class="icobtn x" data-add="close" title="close"
            aria-label="close"><span class="ms">close</span></button></div>
        <input id="addName" placeholder="a name for it, e.g. work"
          value="${esc(ADD.name)}" autocomplete="off" spellcheck="false">
        <div class="hint ${problem ? "bad" : ""}">${problem
          || "You'll sign in with Anthropic in a new tab. Nothing changes until it works."}</div>
        <label class="chk"><input type="checkbox" id="addActivate"
          ${ADD.activate ? "checked" : ""}>make it the global account too</label>
        <div class="row"><button class="go" data-add="start" ${ready ? "" : "disabled"}
          ><span class="ms">login</span>Start sign-in</button></div>
      </div>`;
    }
    if (ADD_LIVE.includes(ADD.state)){
      return `<div class="addpanel">
        <div class="ahd"><span class="sp"></span>${addRelog()
          ? `signing in again as` : `signing in as`} ${esc(ADD.name)}</div>
        ${ADD.url
          ? `<a class="signin" href="${esc(ADD.url)}" target="_blank" rel="noopener"
               ><span class="ms">open_in_new</span>Open the sign-in page</a>`
          : `<div class="hint">starting…</div>`}
        <div class="hint">If that page shows you a <b>code</b>, paste it here. If it
          just says you're done, there's nothing to do — this finishes on its own.</div>
        ${ADD.needsCode ? `<div class="row">
          <input id="addCode" placeholder="paste the code" autocomplete="off"
            spellcheck="false">
          <button class="go" data-add="code"><span class="ms">send</span>Send</button>
        </div>` : ""}
        ${ADD.log ? `<div class="tail">${esc(logTail(ADD.log))}</div>` : ""}
        <div class="row"><button class="ghost" data-add="cancel">Cancel</button></div>
      </div>`;
    }
    /* terminal, and not done — done never renders, the new card replaces it */
    return `<div class="addpanel">
      <div class="ahd"><span class="ms">error</span>${esc(ADD.name)} was not ${
        addRelog() ? "signed in again" : "created"}
        <button class="icobtn x" data-add="close" title="close"
          aria-label="close"><span class="ms">close</span></button></div>
      <div class="hint bad">${esc(ADD.error || "the sign-in did not complete")}</div>
      <div class="hint">${addRelog()
        ? "Nothing was changed — it still has the credentials it had."
        : "Nothing was changed. Your other accounts are untouched."}</div>
      <div class="row"><button class="go" data-add="retry"
        ><span class="ms">refresh</span>Try again</button></div>
    </div>`;
  }

  function paintAdd(){
    const slot = $("#addSlot");
    if (!slot) return;
    /* Don't redraw under someone's fingers: a repaint on every poll would wipe a
       half-typed code and steal the caret. */
    const typing = document.activeElement;
    const keep = typing && (typing.id === "addName" || typing.id === "addCode")
      ? { id:typing.id, value:typing.value, at:typing.selectionStart } : null;
    /* Same reason, for the log box: the poll repaints once a second, and an
       innerHTML swap puts a scrolled box back at the top every time — so reading
       anything above the last few lines was impossible while a sign-in ran. Carry
       the position across the swap, and keep a box that was AT the bottom pinned
       there so new output still follows on its own. A box that has just appeared
       starts at the bottom, because the newest line is the one worth showing. */
    const oldTail = $(".addpanel .tail");
    const scroll = oldTail
      ? { top:oldTail.scrollTop,
          atEnd:oldTail.scrollHeight - oldTail.clientHeight - oldTail.scrollTop <= 4 }
      : null;
    slot.innerHTML = addHTML();
    const newTail = $(".addpanel .tail");
    if (newTail)
      newTail.scrollTop = (!scroll || scroll.atEnd) ? newTail.scrollHeight : scroll.top;
    if (keep){
      const el = $("#" + keep.id);
      if (el){
        el.value = keep.value;
        el.focus();
        try { el.setSelectionRange(keep.at, keep.at); } catch (e) {}
      }
    }
  }

  function addReset(){
    clearInterval(addPollT); addPollT = null;
    ADD = { ...ADD_IDLE };
    paintAdd();
    /* an expired card hides its button while a sign-in runs; this is where it
       comes back */
    if (PROFILES.length) renderStage();
  }

  /* The way in from a card. Takes over the add slot — one sign-in runs at a
     time, so one panel drives it — and scrolls it into view, because the button
     that opened it can be a long way up the page from the slot that answers. */
  function reloginOpen(name){
    if (ADD_LIVE.includes(ADD.state)) return;
    clearInterval(addPollT); addPollT = null;
    ADD = { ...ADD_IDLE, kind:"relogin", state:"naming", name };
    paintAdd();
    renderStage();
    const slot = $("#addSlot");
    if (slot) slot.scrollIntoView({ behavior:reduced ? "auto" : "smooth", block:"center" });
  }

  /* Every response on this channel is read through here, because not every
     response is JSON. An endpoint the sidecar does not have answers `not found`
     as plain text, and a bare r.json() turns that into "Unexpected token 'o'" —
     a parser's complaint standing in for the actual problem, which is that the
     page and the sidecar are different versions. That happens for real: the page
     is re-read from disk on every request, so a reload picks up a new button
     while the running sidecar is still the old process. Say that instead. */
  async function addJSON(r, what){
    let d = {};
    try { d = await r.json(); } catch (_){}
    if (r.ok && d.ok !== false) return d;
    if (r.status === 404 && !d.error)
      throw new Error(`this dashboard is running an older sidecar — ` +
        `stop it and run \`claudius serve\` again to pick up ${what}`);
    throw new Error(d.error || "HTTP " + r.status);
  }

  async function addStart(){
    const relog = addRelog();
    const name = relog ? ADD.name : (($("#addName") || {}).value || ADD.name);
    if (!name) return;
    if (!relog){
      ADD.activate = !!(($("#addActivate") || {}).checked);
      if (addNameProblem(name)) return;
    }
    ADD.name = name; ADD.busy = true;
    try{
      const r = await fetch(relog
        ? `/api/relogin?profile=${encodeURIComponent(name)}`
        : `/api/add?profile=${encodeURIComponent(name)}${ADD.activate ? "&activate=1" : ""}`,
        { method:"POST", headers:{ "X-CSRF-Token":TOKEN } });
      const d = await addJSON(r, relog ? "sign in again" : "add an account");
      Object.assign(ADD, { state:d.state, id:d.id, url:d.url, needsCode:d.needs_code,
                           log:d.log || "", error:null, busy:false });
      log("sys", relog ? `signing <b>${esc(name)}</b> in again`
                       : `signing in a new account — <b>${esc(name)}</b>`, "");
      paintAdd();
      renderStage();          /* the card drops its button while this runs */
      clearInterval(addPollT);
      addPollT = setInterval(addPoll, 1000);
    }catch(e){
      ADD.busy = false;
      log("err", `could not start the sign-in — ${esc(e.message)}`);
      toast(e.message, "error", true);
      ADD.state = "naming";
      paintAdd();
    }
  }

  async function addPoll(){
    try{
      const r = await fetch("/api/add/status", { cache:"no-store" });
      const d = await addJSON(r, "this sign-in");
      const was = ADD.state;
      Object.assign(ADD, { state:d.state, url:d.url || ADD.url,
                           needsCode:d.needs_code, log:d.log || "", error:d.error });
      if (ADD_LIVE.includes(d.state)){ paintAdd(); return; }
      clearInterval(addPollT); addPollT = null;
      const relog = addRelog();
      if (d.state === "done"){
        if (relog){
          log("live", `signed <b>${esc(d.name)}</b> in again`, "");
          toast(`${d.name} is signed in again`, "check");
        } else {
          log("switch", `added <b>${esc(d.name)}</b>${
            d.activated ? " and made it the global account" : ""}`, "");
          toast(`${d.name} is ready`, "check");
        }
        ADD = { ...ADD_IDLE };
        /* the sidecar hands back the list it read AFTER cleaning up, so this is
           the first moment the new account is safe to draw */
        if (Array.isArray(d.profiles)) PROFILES = order(d.profiles);
        await loadHistory(true);
        renderAll(); paintResets();
        /* Its usage cache is as old as the token that expired, and the one thing
           worth knowing now is whether the new credential actually works. One
           call answers both. */
        if (relog) readLive(d.name);
        return;
      }
      if (was !== d.state)
        log("err", `<b>${esc(ADD.name)}</b> was not ${relog ? "signed in again" : "created"
          } — ${esc(ADD.error || d.state)}`);
      paintAdd();
      if (PROFILES.length) renderStage();
    }catch(e){
      clearInterval(addPollT); addPollT = null;
      ADD.state = "failed";
      ADD.error = e.message;
      paintAdd();
    }
  }

  async function addSendCode(){
    const el = $("#addCode");
    const code = (el && el.value || "").trim();
    if (!code) return;
    try{
      const r = await fetch("/api/add/code", { method:"POST",
        headers:{ "X-CSRF-Token":TOKEN, "Content-Type":"application/json" },
        body:JSON.stringify({ code }) });
      await addJSON(r, "the code channel");
      if (el) el.value = "";
      /* The code is never logged — not here, not in the sidecar. Only that one
         was sent. */
      log("sys", "sent the sign-in code", "");
    }catch(e){
      toast(e.message, "error", true);
    }
  }

  async function addCancel(){
    clearInterval(addPollT); addPollT = null;
    try{
      await fetch("/api/add/cancel", { method:"POST", headers:{ "X-CSRF-Token":TOKEN } });
      log("sys", `cancelled the sign-in for <b>${esc(ADD.name)}</b>`, "");
    }catch(e){ /* it may already be gone; the reset below is what matters */ }
    addReset();
  }

  /* ═══════════ the room ═══════════════════════════════════════════════ */
  let ambLayer = 0, ambFor = null;
  function setAmbient(p, immediate){
    if (!p) return;
    const sig = p.name + ":" + fieldFor(p.name).id + ":" + (p.u5 ?? "-");
    if (sig === ambFor) return;
    ambFor = sig;
    const next = $(`#ambient .amb[data-layer="${ambLayer ^ 1}"]`);
    const cur  = $(`#ambient .amb[data-layer="${ambLayer}"]`);
    const id = identity(p.name);
    /* the room runs slower and dimmer than the card — atmosphere, not a rival */
    const e = escalate(p.u5, id, 2.4);
    e.int = Math.min(1, e.int * 0.8);
    next.setAttribute("style", styleVars(id, e));
    next.innerHTML = fieldHTML(p.name);
    const flip = () => { next.classList.add("on"); cur.classList.remove("on"); };
    immediate ? flip() : requestAnimationFrame(flip);
    ambLayer ^= 1;
  }

  /* ═══════════ palette ════════════════════════════════════════════════ */
  const BIASES = ["neutral","cool","warm"], SEVSETS = ["dusty","standard","punchy"];
  const SEV_SW = { dusty:["#71AF8E","#B4924F","#BE6E7E"],
                   standard:["#52D096","#DDAE52","#E76A80"],
                   punchy:["#1CF29C","#FFBE2E","#FF4670"] };

  /* The two attribute-driven looks, and the defaults declared on <html>. The head
     script has already restored these before the first paint; this is the
     authoritative check, so a value it let through that isn't in these lists —
     hand-edited storage, or the two copies drifting — is repaired rather than
     left to render as a broken palette and a nonsense name in the menu. */
  const LOOKS = { bias:BIASES, sevset:SEVSETS };
  const LOOK_DEFAULT = { bias:"neutral", sevset:"punchy" };
  Object.keys(LOOKS).forEach(k => {
    const root = document.documentElement;
    /* the head copy may have let something through, or the two lists may have
       drifted — against these lists the attribute is what gets repaired */
    if (LOOKS[k].indexOf(root.dataset[k]) < 0) root.dataset[k] = LOOK_DEFAULT[k];
    /* and a stored value this build no longer knows is cleaned rather than left
       to be silently ignored on every future load. An unset key stays unset. */
    const stored = store.get(k);
    if (stored != null && LOOKS[k].indexOf(stored) < 0) store.set(k, root.dataset[k]);
  });
  const cycleLook = w => {
    const root = document.documentElement, list = LOOKS[w];
    const next = list[(list.indexOf(root.dataset[w]) + 1) % list.length];
    root.dataset[w] = next;
    store.set(w, next);
  };

  let palQ = "";
  function palRows(){
    const q = palQ.toLowerCase(), hit = s => !q || s.toLowerCase().includes(q);
    const root = document.documentElement;
    let out = "";
    const profs = PROFILES.filter(p => hit(p.name) || hit(p.email || ""));
    if (profs.length) out += `<div class="palsec">global account</div>` + profs.map(p => `
      <button class="palrow ${p.active ? "on" : ""}" data-palsel="${esc(p.name)}">
        <span class="ms">${p.active ? "radio_button_checked" : "radio_button_unchecked"}</span>
        <span class="nm">${esc(p.name)}</span>
        <span class="meta">cache ${ago(p.uts)}</span></button>`).join("");
    const acts = [];
    if (hit("read live limits for all"))
      acts.push(`<button class="palrow" data-act="all"><span class="ms">bolt</span>
        <span style="font-size:13px">Read live limits for all</span>
        <span class="meta">${PROFILES.length} call${PROFILES.length === 1 ? "" : "s"}</span>
        </button>`);
    if (hit("reload from cache"))
      acts.push(`<button class="palrow" data-act="reload"><span class="ms">cached</span>
        <span style="font-size:13px">Reload from cache</span>
        <span class="meta">free</span></button>`);
    if (acts.length) out += `<div class="palsec">actions</div>` + acts.join("");
    const apps = [];
    if (hit("reset display") || hit("appearance"))
      apps.push(`<button class="palrow" data-cycle="reset"><span class="ms">schedule</span>
        <span style="font-size:13px">Reset display</span>
        <span class="meta">${MODE_LABEL[resetMode]} ›</span></button>`);
    /* Named for what they do to the page, not for the internals they drive: the
       attributes stay `bias` / `sevset` and severity keeps its meaning in the CSS
       and the design rules at the top of this file. The old words are still
       searchable so the palette answers to either. */
    if (hit("color") || hit("colour") || hit("greys") || hit("grey") || hit("tint")
        || hit("appearance"))
      apps.push(`<button class="palrow" data-cycle="bias"><span class="ms">palette</span>
        <span style="font-size:13px">Color</span>
        <span class="meta">${root.dataset.bias} ›</span></button>`);
    if (hit("contrast") || hit("severity") || hit("sev") || hit("appearance"))
      apps.push(`<button class="palrow" data-cycle="sevset"><span class="ms">contrast</span>
        <span style="font-size:13px">Contrast</span>
        <span class="swatch">${SEV_SW[root.dataset.sevset].map(c =>
          `<i style="background:${c}"></i>`).join("")}</span>
        <span class="meta" style="margin-left:8px">${root.dataset.sevset} ›</span></button>`);
    if (apps.length) out += `<div class="palsec">appearance</div>` + apps.join("");
    return out || `<div class="palempty">nothing matches “${esc(palQ)}”</div>`;
  }
  function paintPal(){
    $("#palList").innerHTML = palRows();
    $("#palWho").textContent = activeName() || "—";
  }
  const closeMenus = () =>
    $$(".kmenu.on,.palpop.on").forEach(m => m.classList.remove("on", "up"));

  /* ═══════════ render ═════════════════════════════════════════════════ */
  function renderStage(){
    if (!PROFILES.length){
      $("#heroSlot").innerHTML =
        `<div class="sk"><div style="color:var(--fg-2);font-size:14px">No profiles found in
         <span class="root">{{ROOT}}</span>. Add one below, or with
         <span style="font-family:var(--mono)">claudius add</span>.</div></div>`;
      $("#othersLbl").hidden = true;
      $("#othersSlot").innerHTML = "";
      return;
    }
    const hero = activeProfile();
    if (hero){
      $("#heroSlot").innerHTML = heroHTML(hero);
      const rest = PROFILES.filter(p => p !== hero);
      $("#othersLbl").hidden = rest.length === 0;
      $("#othersLbl").textContent = "other profiles";
      $("#othersSlot").innerHTML = rest.map(cardHTML).join("");
    } else {
      /* nothing is the global account — don't crown an arbitrary profile */
      $("#heroSlot").innerHTML = "";
      $("#othersLbl").hidden = false;
      $("#othersLbl").textContent = "no global account — pick one below";
      $("#othersSlot").innerHTML = PROFILES.map(cardHTML).join("");
    }
    /* let the lanes grow from zero on the frame after paint */
    requestAnimationFrame(() => {
      $$(".lt i[data-w]").forEach((i, k) =>
        setTimeout(() => { i.style.width = i.dataset.w + "%"; }, 20 + k * 24));
    });
    restoreBusy();
  }
  function restoreBusy(){
    busy.forEach(name => {
      $$(`[data-live="${name}"]`).forEach(b => {
        b.disabled = true; b.innerHTML = `<span class="sp"></span>`;
      });
    });
  }
  function paintResets(){
    $$("[data-reset]").forEach(el => {
      const ep = +el.dataset.reset;
      el.textContent = resetText(ep || 0);
    });
    $$(".peers .cell.follow .k").forEach(el => { el.textContent = resetLabel(); });
    paintTrends();
  }
  /* paintSessions is in here because switching the active account changes the
     shape of every copied command — the active one takes bare `claude`. */
  function renderAll(){
    renderStage(); paintPal(); paintSessions(); paintAdd();
    setAmbient(activeProfile() || PROFILES[0]);
  }

  /* ═══════════ events ═════════════════════════════════════════════════ */
  const DUR = { reading:1400, rippling:1450, blooming:1400 };
  function fire(kind, nodes){
    (nodes || $$(".surface")).forEach(c => {
      c.classList.remove(kind);
      void c.offsetWidth;
      c.classList.add(kind);
      setTimeout(() => c.classList.remove(kind), DUR[kind]);
    });
  }

  /* ═══════════ api ════════════════════════════════════════════════════ */
  async function getProfiles(){
    const r = await fetch("/api/profiles", { cache:"no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return order(await r.json());
  }
  async function post(path, name){
    const r = await fetch(path + "?profile=" + encodeURIComponent(name),
      { method:"POST", headers:{ "X-CSRF-Token":TOKEN } });
    let data = {};
    try { data = await r.json(); } catch (_) {}
    if (!r.ok || data.ok === false)
      throw new Error(data.error || (data.output || "").split("\n").pop() || "HTTP " + r.status);
    return data;
  }

  /* Drop choices for profiles that are gone, so a browser doesn't carry a
     removed name forever. Only ever runs against a list that actually loaded —
     an empty one means the read failed or every profile really is gone, and in
     neither case is forgetting the styles the helpful move. */
  function pruneStyle(){
    if (!PROFILES.length) return;
    const live = {};
    PROFILES.forEach(p => { live[p.name] = 1; });
    let cut = false;
    Object.keys(STYLE).forEach(n => { if (!live[n]){ delete STYLE[n]; cut = true; } });
    if (cut) saveStyle();
  }

  /* History and the recommendation are read alongside the profiles but never
     block them: both are free, local and additive, and a page that showed
     nothing because a sparkline failed would be a worse page than one with no
     sparkline. A failure here leaves the previous reading in place and says so
     once, rather than logging a row every time the 30-second ring comes round. */
  let histWarned = false;
  async function loadHistory(quiet){
    try{
      const [h, n] = await Promise.all([
        fetch("/api/history?points=48", { cache:"no-store" }).then(r => r.json()),
        fetch("/api/next", { cache:"no-store" }).then(r => r.json())
      ]);
      const map = {};
      (Array.isArray(h) ? h : []).forEach(row => { map[row.name] = row; });
      HIST = map;
      NEXT = (n && typeof n === "object") ? n : null;
      histWarned = false;
    }catch(e){
      if (!histWarned && !quiet){
        histWarned = true;
        log("err", `could not read usage history — ${esc(e.message)}`);
      }
    }
  }

  async function load(quiet){
    try{
      PROFILES = await getProfiles();
      await loadHistory(quiet);
      pruneStyle();
      renderAll();
      paintResets();
      if (!quiet) log("sys", `loaded ${PROFILES.length} profile${
        PROFILES.length === 1 ? "" : "s"} from cache`, "free");
      return true;
    }catch(e){
      log("err", `could not read the profile list — ${esc(e.message)}`);
      toast("Could not read the profile list. Is the sidecar still running?", "error", true);
      return false;
    }
  }

  async function readLive(name){
    if (busy.has(name)) return;
    busy.add(name);
    $$(`[data-live="${name}"]`).forEach(b => {
      b.disabled = true; b.innerHTML = `<span class="sp"></span>`;
    });
    fire("reading", $$(`.surface[data-name="${name}"]`));
    try{
      const data = await post("/api/refresh", name);
      calls++;
      $("#callTally").textContent = calls;
      if (Array.isArray(data.profiles)) PROFILES = order(data.profiles);
      const p = PROFILES.find(x => x.name === name) || {};
      log("live", `<b>${esc(name)}</b> read live — 5h ${p.u5 ?? "—"}% · 7d ${p.u7 ?? "—"}%`);
      busy.delete(name);
      /* the read just appended a sample, so the rate it feeds has moved too */
      await loadHistory(true);
      renderAll(); paintResets();
    }catch(e){
      busy.delete(name);
      log("err", `<b>${esc(name)}</b> refresh failed — ${esc(e.message)}`);
      toast(`Refresh failed for ${name}: ${e.message}`, "error", true);
      /* A refresh fails for good when there is nothing left to renew. Re-read the
         list so the card can say that itself and offer the way back — otherwise
         the only account that needs an action looks exactly like the others. */
      try { PROFILES = await getProfiles(); } catch (_){}
      renderAll(); paintResets();
    }
  }

  /* Promotion: the new global flies from its card into the hero slot, coming
     forward on z, and the outgoing hero shrinks into the vacated slot. A FLIP —
     measure, re-render, invert, play — so the grid still does the layout. The
     border trace fires on landing, as the receipt. */
  async function activate(name){
    if (name === activeName() || busy.has("@switch")) return;
    busy.add("@switch");
    /* The switch is a subprocess away, so the pill has to say it is working. The
       spinner goes IN the dot's slot rather than replacing the label: same box,
       same width, nothing under it moves — and the dot is the part that means
       "selected", so spinning it is the honest place to put the wait. */
    const pill = $(`[data-sel="${name}"]`);
    if (pill){
      pill.disabled = true;
      pill.classList.add("busy");
      const dot = $(".dot", pill);
      if (dot) dot.className = "sp";
    }
    const stage = $("#stage");
    const box = el => el.getBoundingClientRect();
    const before = new Map($$("[data-name]", stage).map(el => [el.dataset.name, box(el)]));
    const prev = activeName();
    try{
      const data = await post("/api/activate", name);
      if (Array.isArray(data.profiles)) PROFILES = order(data.profiles);
      else PROFILES = order(PROFILES.map(p => ({ ...p, active:p.name === name })));
    }catch(e){
      busy.delete("@switch");
      log("err", `switch to <b>${esc(name)}</b> failed — ${esc(e.message)}`);
      toast(`Could not switch to ${name}: ${e.message}`, "error", true);
      renderAll();
      return;
    }
    busy.delete("@switch");
    renderStage(); paintPal(); paintResets();
    setAmbient(activeProfile() || PROFILES[0]);
    log("switch", `global account → <b>${esc(name)}</b>${
      prev ? ` (was <b>${esc(prev)}</b>)` : ""}`);
    toast(`${name} is the global account`, "swap_horiz");

    const nodes = $$("[data-name]", stage);
    const after = new Map(nodes.map(el => [el.dataset.name, box(el)]));
    const traceHero = () => fire("blooming", [$(".hero", stage)].filter(Boolean));
    if (reduced){ traceHero(); return; }

    let settle = null;
    nodes.forEach(el => {
      const f = before.get(el.dataset.name), l = after.get(el.dataset.name);
      if (!f || !l) return;
      const dx = (f.left + f.width / 2) - (l.left + l.width / 2);
      const dy = (f.top + f.height / 2) - (l.top + l.height / 2);
      /* uniform scale from the width ratio — non-uniform rubber-bands the content */
      const s = f.width / l.width;
      if (Math.abs(dx) < .5 && Math.abs(dy) < .5 && Math.abs(s - 1) < .01) return;
      const rising = el.dataset.name === name;
      el.style.willChange = "transform, opacity";
      if (rising){
        el.style.zIndex = "30";
        const a = el.animate([
          { transform:`translate3d(${dx}px,${dy}px,0) scale(${s})`, opacity:.55 },
          { transform:`translate3d(${dx * .34}px,${dy * .34}px,110px) scale(${s + (1 - s) * .72})`,
            opacity:1, offset:.5 },
          { transform:"translate3d(0,0,0) scale(1)", opacity:1 },
        ], { duration:1020, easing:"cubic-bezier(.26,.72,.2,1)" });
        settle = a.finished;
        a.finished.then(() => { el.style.zIndex = ""; el.style.willChange = ""; }).catch(() => {});
      } else {
        el.animate([
          { transform:`translate3d(${dx}px,${dy}px,0) scale(${s})`,
            opacity:el.dataset.name === prev ? .6 : 1 },
          { transform:`translate3d(${dx * .5}px,${dy * .5}px,-52px) scale(${s + (1 - s) * .5})`,
            offset:.44 },
          { transform:"translate3d(0,0,0) scale(1)", opacity:1 },
        ], { duration:920, easing:"cubic-bezier(.32,.68,.22,1)" })
          .finished.then(() => { el.style.willChange = ""; }).catch(() => {});
      }
    });
    if (settle) settle.then(traceHero).catch(traceHero); else traceHero();
  }

  async function readAll(){
    const names = PROFILES.map(p => p.name);
    log("sys", `reading live limits for ${names.length} account${
      names.length === 1 ? "" : "s"}`, `${names.length} calls`);
    for (const n of names){ await readLive(n); await sleep(120); }
  }

  /* One clipboard path for both the profile cards and the session rows. `echo`
     is the button that should tick over to a checkmark; the toast covers the
     copies fired from a menu, where no button is left on screen to answer. */
  function copyCmd(cmd, echo){
    navigator.clipboard?.writeText(cmd).catch(() => {});
    log("copy", `copied <b>${esc(cmd)}</b>`);
    toast(`Copied “${cmd}”`, "content_copy");
    $$(echo).forEach(i => {
      i.textContent = "check";
      i.style.color = "var(--ok)";
      setTimeout(() => { i.textContent = "content_copy"; i.style.color = ""; }, 1100);
    });
  }
  function copyRun(name){
    copyCmd(`claudius run ${name}`, `button[data-copy="${name}"] .ms`);
  }

  /* ═══════════ linked sessions ════════════════════════════════════════
     `run` symlinks ~/.claude/projects into every wired profile, so the session
     pool is shared, not per-account: one list, and any profile can resume any
     row. That's why this is a page-level panel and not something on a card.

     Scanning costs a subprocess (a Ruby scan over the transcript store), so it
     runs on demand and on boot — deliberately NOT on the 30s watch tick, which
     is supposed to be the free one. */
  let SESSIONS = null;                     /* null = not read yet, [] = empty pool */
  let sessTarget = store.get("sessTarget") || "";
  /* The project scope is remembered — "I work in this repo" is a standing
     preference, and the control shows what it is. The query is not: a search box
     that refills itself on open would hide rows behind a filter nobody typed
     this session. */
  let sessScope = store.get("sessScope") || "";
  let sessQ = "";
  /* How many rows were asked for. 0 means the whole pool — a deliberate request,
     not a default, because scanning everything costs a subprocess over every
     transcript in the store. */
  let sessLimit = 40;
  /* Keyboard cursor into the *visible* rows, -1 when nothing is picked. Filtering
     changes what is visible, so it is reset whenever the filter does. */
  let sessCursor = -1;

  /* Which account the copied commands resume with. A remembered name that has
     since been removed falls back to the active one rather than copying a
     command for a profile that is gone. */
  function sessWho(){
    if (sessTarget && PROFILES.some(p => p.name === sessTarget)) return sessTarget;
    return activeName() || (PROFILES[0] || {}).name || "";
  }
  function cycleSessWho(){
    if (!PROFILES.length) return;
    const names = PROFILES.map(p => p.name);
    const i = names.indexOf(sessWho());
    sessTarget = names[(i + 1) % names.length];
    store.set("sessTarget", sessTarget);
    paintSessions();
  }

  /* Only quote when the shell would care — an unquoted path reads better, and
     most of these are plain. */
  const shq = s => /^[A-Za-z0-9_@%+=:,.\/-]+$/.test(s) ? s : `'${s.replace(/'/g, `'\\''`)}'`;

  /* The active account is reached by bare `claude` — `claudius run` is only how
     you reach a NON-active one, so the command shape follows the target. The cd
     is not decoration: --resume resolves a session against the project it
     belongs to, so the wrong directory finds nothing. */
  function resumeCmd(s, who){
    const inner = who && who !== activeName()
      ? `claudius run ${who} --resume ${s.id}`
      : `claude --resume ${s.id}`;
    return s.cwd ? `cd ${shq(s.cwd)} && ${inner}` : inner;
  }

  const sessAge = t => {
    if (!t) return "—";
    const d = Math.max(0, Math.floor(Date.now() / 1000) - t);
    if (d < 60)    return d + "s";
    if (d < 3600)  return Math.floor(d / 60) + "m";
    if (d < 86400) return Math.floor(d / 3600) + "h";
    return Math.floor(d / 86400) + "d";
  };
  /* The pool is keyed by cwd, so the basename is what distinguishes one row from
     another; the full path is worth having but not worth the width. The home
     directory is the exception — its basename is a username, which in a narrow
     column is indistinguishable from a profile name, so it keeps the `~` the CLI
     already wrote for it. */
  /* A transcript that never recorded a cwd still belongs to a project: the pool is
     keyed by directory, so a sibling row under the same key already knows the path.
     Falling back to the raw key would put `-home-axius-workspace-realizacija` on
     screen — an internal encoding, and one that reads as a different project from
     its own siblings. Memoised on the array identity, so a reload rebuilds it and
     a repaint does not. */
  let dirPaths = { src:null, map:{} };
  function dirPathMap(){
    if (dirPaths.src === SESSIONS) return dirPaths.map;
    const map = {};
    (SESSIONS || []).forEach(s => {
      const k = s.dirkey || "";
      if (k && !map[k] && (s.short || s.cwd)) map[k] = s.short || s.cwd;
    });
    dirPaths = { src:SESSIONS, map };
    return map;
  }
  /* Written the way a person writes it, for the tooltip. */
  const projPath = s => s.short || s.cwd || dirPathMap()[s.dirkey] || "unknown project";
  const projName = s => {
    const p = projPath(s);
    if (p === "~" || p === "unknown project") return p;
    const parts = p.replace(/\/+$/, "").split("/");
    return parts[parts.length - 1] || p;
  };

  /* Only once it is worth knowing: under a megabyte this is noise, and the exact
     byte count never matters. */
  const weightOf = s => {
    const b = Number(s.size) || 0;
    if (b < 1048576) return "";
    const mb = b / 1048576;
    return mb >= 10 ? `${Math.round(mb)}MB` : `${mb.toFixed(1)}MB`;
  };
  const stamp = t => {
    if (!t) return "never";
    try { return new Date(t * 1000).toLocaleString(); }
    catch (e) { return String(t); }
  };

  /* One project per dirkey, labelled by its basename and ordered by how recently
     it was touched — the pool is keyed by directory, so dirkey is the identity
     and the path is only for display. */
  function sessProjects(){
    const seen = new Map();
    (SESSIONS || []).forEach(s => {
      const k = s.dirkey || s.cwd || "";
      const cur = seen.get(k);
      if (cur){ cur.n++; if (s.mts > cur.mts) cur.mts = s.mts; }
      else seen.set(k, { key:k, name:projName(s), path:s.cwd || s.dirkey || "", n:1, mts:s.mts });
    });
    return [...seen.values()].sort((a, b) => b.mts - a.mts);
  }

  /* Substring, case-insensitive, over every field a row actually shows plus the
     id — pasting a session id into the box should find it. */
  function sessMatch(s, q){
    if (!q) return true;
    return [s.label, s.cwd, s.branch, s.id, projName(s), projPath(s)]
      .some(v => v && String(v).toLowerCase().includes(q));
  }
  function visibleSessions(){
    const q = sessQ.trim().toLowerCase();
    return (SESSIONS || []).filter(s =>
      (!sessScope || (s.dirkey || s.cwd || "") === sessScope) && sessMatch(s, q));
  }

  /* Escape first, then wrap: marking up the raw string and escaping afterwards
     would escape the <mark> too, and matching against already-escaped text would
     let a query like "amp" light up inside an entity. */
  function markHits(text, q){
    const s = String(text ?? "");
    if (!q) return esc(s);
    const hay = s.toLowerCase();
    let out = "", i = 0;
    for (;;){
      const at = hay.indexOf(q, i);
      if (at < 0) break;
      out += esc(s.slice(i, at)) + "<mark>" + esc(s.slice(at, at + q.length)) + "</mark>";
      i = at + q.length;
    }
    return out + esc(s.slice(i));
  }

  /* Where a label came from, in the row's tooltip — otherwise a first prompt
     standing in for a title is indistinguishable from one, and you'd wonder why
     some rows read like someone talking. */
  const LSRC_HINT = {
    prompt:"first prompt", last:"last prompt", command:"opening command",
    slug:"session slug", title:"session title",
  };
  const sessLabelHint = s => s.label
    ? `${s.label}${LSRC_HINT[s.lsrc] ? `  ·  ${LSRC_HINT[s.lsrc]}` : ""}`
    : `nothing was said in this session  ·  ${s.id}`;

  /* Quoted for the sources that are someone's words rather than a name. The
     quotes sit outside the highlight so a search never marks punctuation the
     transcript doesn't contain. */
  function sessLabelHTML(s, q){
    if (!s.label) return "empty session";
    const body = markHits(s.label, q);
    return (s.lsrc === "prompt" || s.lsrc === "last")
      ? `<span class="qm">“</span>${body}<span class="qm">”</span>` : body;
  }

  function paintScope(){
    const sel = $("#sessScope"), projects = sessProjects();
    /* A remembered project with nothing left in the pool would filter every row
       away with no way to tell why, so it reverts to everything — but only once
       the pool has actually been read. Before that the list is empty for lack of
       data, and clearing here would drop the preference on every boot. */
    if (SESSIONS != null && sessScope && !projects.some(p => p.key === sessScope)){
      sessScope = "";
      store.set("sessScope", "");
    }
    const total = (SESSIONS || []).length;
    sel.innerHTML = `<option value="">all projects · ${total}</option>` +
      projects.map(p => `<option value="${esc(p.key)}"${p.key === sessScope ? " selected" : ""}
        title="${esc(p.path)}">${esc(p.name)} · ${p.n}</option>`).join("");
    sel.value = sessScope;
    sel.disabled = !total;
  }

  function paintSessions(){
    const who = sessWho();
    $("#sessTargetWho").textContent = who || "no profile";
    $("#sessTargetBtn").hidden = PROFILES.length < 1;
    const body = $("#sessBody"), cnt = $("#sessCnt");
    const filter = $("#sessFilter");
    filter.classList.toggle("has-q", sessQ !== "");
    paintScope();
    if (SESSIONS == null){
      cnt.textContent = "";
      filter.hidden = true;
      body.innerHTML = `<div class="logempty">reading the session pool…</div>`;
      return;
    }
    filter.hidden = !SESSIONS.length;
    if (!SESSIONS.length){
      cnt.textContent = "";
      body.innerHTML = `<div class="logempty">no sessions in the shared pool yet</div>`;
      return;
    }
    const q = sessQ.trim().toLowerCase(), rows = visibleSessions();
    /* Say "N of M" whenever anything is hidden — a filtered count that reads like
       a total is how you conclude sessions went missing. */
    cnt.innerHTML = rows.length === SESSIONS.length
      ? `<b>${SESSIONS.length}</b> shared`
      : `<b>${rows.length}</b> of ${SESSIONS.length}`;
    if (!rows.length){
      body.innerHTML = `<div class="logempty">nothing matches${
        q ? ` “${esc(sessQ.trim())}”` : ""}${sessScope ? " in this project" : ""}</div>`;
      return;
    }
    body.innerHTML = rows.map((s, i) => {
      const cmd = resumeCmd(s, who);
      const gone = s.exists === false;
      /* The command opens with a cd, so a missing directory means it fails on its
         first clause. Still copyable — the directory may be coming back — but the
         row and the tooltip both say so. */
      const cmdHint = gone
        ? `${projPath(s)} no longer exists — this command will fail at the cd`
        : `copy “${cmd}”`;
      return `<div class="srow${gone ? " gone" : ""}${i === sessCursor ? " cur" : ""}"
        data-srow="${esc(s.id)}">
        <span class="age" title="last active ${esc(stamp(s.mts))}">${esc(sessAge(s.mts))}</span>
        <span class="lbl ${s.label ? `src-${esc(s.lsrc || "title")}` : "none"}"
          title="${esc(sessLabelHint(s))}">${sessLabelHTML(s, q)}</span>
        <span class="where" title="${esc(projPath(s))}">${markHits(projName(s), q)}${
          s.branch ? `<span class="br">${markHits(s.branch, q)}</span>` : ""}${
          gone ? `<span class="tag">gone</span>` : ""}</span>
        <span class="wt" title="${esc(s.size ? s.size + " bytes" : "")}">${esc(weightOf(s))}</span>
        <button class="icobtn" data-scopy="${esc(s.id)}"
          title="${esc(cmdHint)}" aria-label="copy resume command">
          <span class="ms">content_copy</span></button>
      </div>`;
    }).join("");
    /* Only offered while the fetch was capped and came back full — that is the
       only time there might be more behind it. */
    if (sessLimit > 0 && SESSIONS.length >= sessLimit)
      body.insertAdjacentHTML("beforeend", `<div class="sessmore">
        <button id="sessAll">show the whole pool</button></div>`);
  }

  /* Arrow keys walk the list and Enter copies, so a search can be finished without
     reaching for the mouse. Clamped rather than wrapping — running off the end of
     a long list by holding a key is worse than stopping at it. */
  function moveSessCursor(delta){
    const rows = visibleSessions();
    if (!rows.length) return;
    const next = sessCursor < 0
      ? (delta > 0 ? 0 : rows.length - 1)
      : Math.min(rows.length - 1, Math.max(0, sessCursor + delta));
    if (next === sessCursor) return;
    sessCursor = next;
    paintSessions();
    const el = $(`[data-srow="${rows[sessCursor].id}"]`);
    if (el) el.scrollIntoView({ block:"nearest" });
  }

  async function loadSessions(quiet){
    try{
      const r = await fetch(`/api/sessions?limit=${sessLimit}`, { cache:"no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      SESSIONS = Array.isArray(data) ? data : [];
      sessCursor = -1;
      paintSessions();
      if (!quiet) log("cache", `read ${SESSIONS.length} shared session${
        SESSIONS.length === 1 ? "" : "s"}${sessLimit ? " (newest first)" : " — the whole pool"}`,
        "free");
    }catch(e){
      SESSIONS = SESSIONS || [];
      paintSessions();
      log("err", `could not read the session pool — ${esc(e.message)}`);
    }
  }

  /* ═══════════ watch cache ════════════════════════════════════════════ */
  const POLL_S = 30, RING = 2 * Math.PI * 11;
  let pollOn = false, pollLeft = POLL_S, pollT = null;
  /* Watching is remembered because it's a working preference, not an action —
     leave it on, come back tomorrow, and the page should still be watching.
     The countdown is not remembered: a reload re-reads the cache anyway, so the
     window starts fresh rather than resuming mid-flight. */
  const pollWanted = () => store.get("watch") === "1";
  function paintRing(){
    const r = $("#pollToggle .rv");
    if (!r) return;
    const frac = pollOn ? (POLL_S - pollLeft) / POLL_S : 0;
    r.style.strokeDashoffset = (RING * (1 - frac)).toFixed(1);
    $("#pollToggle").title = pollOn
      ? `next free cache read in ${pollLeft}s`
      : "Re-read the local cache every 30s — free, no API calls";
  }
  const togglePoll = () => setPoll(!pollOn);
  /* resumed: restoring a remembered state on boot rather than a press now, so
     the log says so and the preference isn't rewritten with what it just read. */
  function setPoll(on, resumed){
    pollOn = on;
    if (!resumed) store.set("watch", pollOn ? "1" : "0");
    $("#pollToggle").setAttribute("aria-checked", String(pollOn));
    pollLeft = POLL_S;
    clearInterval(pollT);
    if (pollOn){
      pollT = setInterval(async () => {
        if (--pollLeft <= 0){
          pollLeft = POLL_S;
          const ok = await load(true);
          if (ok){
            fire("rippling");
            log("cache", `re-read the local cache for ${PROFILES.length} profile${
              PROFILES.length === 1 ? "" : "s"}`);
          }
        }
        paintRing();
      }, 1000);
      log("sys", resumed ? "resumed watching the cache — a free re-read every 30s"
                         : "watching the cache — a free re-read every 30s");
    } else if (!resumed){
      log("sys", "stopped watching the cache");
    }
    paintRing();
  }

  /* ═══════════ wiring ═════════════════════════════════════════════════ */
  document.addEventListener("click", e => {
    if (e.target.closest("#pollToggle")) return togglePoll();
    if (e.target.closest("#logClear")){ LOG.length = 0; paintLog(); return; }
    if (e.target.closest("#sessTargetBtn")) return cycleSessWho();
    if (e.target.closest("#sessQClear")){
      sessQ = "";
      sessCursor = -1;
      $("#sessQ").value = "";
      paintSessions();
      $("#sessQ").focus();
      return;
    }
    if (e.target.closest("#sessAll")){
      sessLimit = 0;                          /* 0 = everything */
      $("#sessAll").disabled = true;
      $("#sessAll").textContent = "reading the whole pool…";
      loadSessions();
      return;
    }
    /* Clicking a row adopts it as the keyboard cursor, so the two ways of moving
       through the list share one position instead of fighting over it. */
    const srow = e.target.closest("[data-srow]");
    if (srow && !e.target.closest("button")){
      sessCursor = visibleSessions().findIndex(s => s.id === srow.dataset.srow);
      paintSessions();
      return;
    }
    if (e.target.closest("#sessReload")){ SESSIONS = null; paintSessions(); loadSessions(); return; }
    const sc = e.target.closest("button[data-scopy]");
    if (sc){
      const s = (SESSIONS || []).find(x => x.id === sc.dataset.scopy);
      if (s) copyCmd(resumeCmd(s, sessWho()), `button[data-scopy="${s.id}"] .ms`);
      return;
    }

    if (e.target.closest("#palBtn")){
      const pop = $("#palPop"), was = pop.classList.contains("on");
      closeMenus();
      if (!was){ pop.classList.add("on"); $("#palQ").focus(); }
      return;
    }
    const cyc = e.target.closest("button[data-cycle]");
    if (cyc){
      const w = cyc.dataset.cycle;
      if (w === "reset"){
        resetMode = MODES[(MODES.indexOf(resetMode) + 1) % MODES.length];
        store.set("resetMode", resetMode);
        renderStage(); paintResets();
      } else {
        cycleLook(w);
        ambFor = null;                       /* the room re-tints with the palette */
        renderStage(); paintResets(); setAmbient(activeProfile() || PROFILES[0], true);
      }
      paintPal();
      return;
    }
    const psel = e.target.closest("button[data-palsel]");
    if (psel){ closeMenus(); activate(psel.dataset.palsel); return; }
    const act = e.target.closest("button[data-act]");
    if (act){
      closeMenus();
      if (act.dataset.act === "all") readAll();
      if (act.dataset.act === "reload") load();
      return;
    }
    const kb = e.target.closest("button[data-kebab]");
    if (kb){
      const m = $(`[data-kmenu="${kb.dataset.kebab}"]`), was = m.classList.contains("on");
      closeMenus();
      if (!was){
        m.classList.add("on");
        /* measure once it's laid out: drop below unless that runs off-screen */
        m.classList.remove("up");
        const r = m.getBoundingClientRect();
        if (r.bottom > innerHeight - 8 && kb.getBoundingClientRect().top > r.height + 16)
          m.classList.add("up");
      }
      return;
    }
    const st = e.target.closest("button[data-style]");
    if (st){
      const [n, i] = st.dataset.style.split(":");
      STYLE[n] = +i; saveStyle();
      closeMenus();
      ambFor = null;
      renderStage(); paintResets();
      if (n === activeName()) setAmbient(activeProfile() || PROFILES[0]);
      return;
    }
    const ka = e.target.closest("button[data-kact]");
    if (ka){
      const [kind, who] = ka.dataset.kact.split(":");
      closeMenus();
      if (kind === "live") return readLive(who);
      if (kind === "relog") return reloginOpen(who);
      if (kind === "copy") return copyRun(who);
      if (kind === "shuffle"){
        const cur = FIELDS.indexOf(fieldFor(who));
        let i; do { i = Math.floor(Math.random() * FIELDS.length); } while (i === cur);
        STYLE[who] = i; saveStyle();
        ambFor = null;
        renderStage(); paintResets();
        if (who === activeName()) setAmbient(activeProfile() || PROFILES[0]);
      }
      return;
    }
    const lv = e.target.closest("button[data-live]");
    if (lv) return readLive(lv.dataset.live);
    const rl = e.target.closest("button[data-relog]");
    if (rl) return reloginOpen(rl.dataset.relog);
    const cp = e.target.closest("button[data-copy]");
    if (cp) return copyRun(cp.dataset.copy);
    const sel = e.target.closest("button[data-sel]");
    if (sel) return activate(sel.dataset.sel);
    /* Qualified with `button` for the reason at the top of this file: a bare
       [data-add] would also match <html> if the token ever moved there. */
    const ad = e.target.closest("button[data-add]");
    if (ad){
      const what = ad.dataset.add;
      if (what === "open"){ ADD.state = "naming"; paintAdd(); $("#addName").focus(); return; }
      if (what === "close" || what === "retry"){
        const retry = what === "retry" && ADD.name;
        const name = ADD.name, kind = ADD.kind;
        addReset();
        if (retry){
          /* back to the same question that was just answered — including which
             of the two sign-ins this was, or a retry would try to ADD a name
             that already exists */
          ADD.state = "naming"; ADD.name = name; ADD.kind = kind;
          paintAdd();
          const f = $("#addName"); if (f) f.focus();
        }
        return;
      }
      if (what === "start")  return addStart();
      if (what === "code")   return addSendCode();
      if (what === "cancel") return addCancel();
      return;
    }

    if (!e.target.closest(".kmenu,.palpop")) closeMenus();
  });

  document.addEventListener("input", e => {
    if (e.target.id === "palQ"){ palQ = e.target.value.trim(); $("#palList").innerHTML = palRows(); }
    /* Judged as you type — the name is the one thing that can be wrong before
       anything irreversible happens, so it should be wrong quietly and early. */
    if (e.target.id === "addName"){ ADD.name = e.target.value.trim(); paintAdd(); }
  });
  /* Enter submits whichever field you are in. Both are one-line answers, and
     reaching for the mouse to confirm a single word is a waste of a hand. */
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if (e.target.id === "addName" && ADD.state === "naming"){ e.preventDefault(); addStart(); }
    if (e.target.id === "addCode"){ e.preventDefault(); addSendCode(); }
  });
  /* Both filters reset the cursor: it indexes into what is visible, and what is
     visible just changed underneath it. */
  $("#sessQ").addEventListener("input", e => {
    sessQ = e.target.value; sessCursor = -1; paintSessions();
  });
  $("#sessScope").addEventListener("change", e => {
    sessScope = e.target.value;
    sessCursor = -1;
    store.set("sessScope", sessScope);
    paintSessions();
  });


  document.addEventListener("keydown", e => {
    if (e.key === "Escape"){
      closeMenus();
      /* Escape in the box clears the filter before it does anything else —
         the shortcut that got you there should get you back. */
      if (e.target === $("#sessQ") && sessQ !== ""){
        sessQ = ""; sessCursor = -1; e.target.value = ""; paintSessions();
      }
      return;
    }
    /* The arrows drive the list from the search box (where you already are after
       `/`) or from a row. Anywhere else they still scroll the page. */
    const inList = e.target === $("#sessQ") || (e.target.closest && e.target.closest("[data-srow]"));
    if (inList && (e.key === "ArrowDown" || e.key === "ArrowUp")){
      e.preventDefault();
      moveSessCursor(e.key === "ArrowDown" ? 1 : -1);
      return;
    }
    if (inList && e.key === "Enter"){
      const rows = visibleSessions();
      const s = rows[sessCursor];
      if (s){
        e.preventDefault();
        copyCmd(resumeCmd(s, sessWho()), `button[data-scopy="${s.id}"] .ms`);
      }
      return;
    }
    /* `/` jumps to the search, but not while something already has typing focus,
       or it would eat the slash mid-path. */
    const t = e.target;
    const typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" ||
      t.tagName === "SELECT" || t.isContentEditable);
    if (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey && !e.altKey){
      e.preventDefault();
      $("#sessQ").focus();
      $("#sessQ").select();
    }
  });
  document.addEventListener("pointermove", e => {
    const c = e.target.closest?.(".surface");
    if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", `${((e.clientX - r.left) / r.width * 100).toFixed(1)}%`);
    c.style.setProperty("--my", `${((e.clientY - r.top) / r.height * 100).toFixed(1)}%`);
  }, { passive:true });

  /* tick the live countdowns; the other modes are static so skip them */
  setInterval(() => { if (resetMode === "countdown") paintResets(); }, 1000);

  skeleton();
  paintLog();
  paintRing();
  if (pollWanted()) setPoll(true, true);   /* the pill paints correct on first frame */
  paintSessions();
  load();                                  /* renderAll repaints the rows when it lands */
  loadSessions(true);                      /* the pool doesn't wait on the profile list */
})();
</script>
</body>
</html>
