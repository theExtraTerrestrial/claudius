      i.textContent = "check";
      i.style.color = "var(--ok)";
      setTimeout(() => { i.textContent = "content_copy"; i.style.color = ""; }, 1100);
    });
  }
  function copyRun(name){
    copyCmd(`claudius run ${name}`, `button[data-copy="${name}"] .ms`);
  }

  /* ═══════════ linked sessions ════════════════════════════════════════
     `run` symlinks ~/.claude/projects into every wired profile, so the session
     pool is shared, not per-account: one list, and any profile can resume any
     row. That's why this is a page-level panel and not something on a card.

     Scanning costs a subprocess (a Ruby scan over the transcript store), so it
     runs on demand and on boot — deliberately NOT on the 30s watch tick, which
     is supposed to be the free one. */
  let SESSIONS = null;                     /* null = not read yet, [] = empty pool */
  let sessTarget = store.get("sessTarget") || "";
  /* The project scope is remembered — "I work in this repo" is a standing
     preference, and the control shows what it is. The query is not: a search box
     that refills itself on open would hide rows behind a filter nobody typed
     this session. */
  let sessScope = store.get("sessScope") || "";
  let sessQ = "";
  /* How many rows were asked for. 0 means the whole pool — a deliberate request,
     not a default, because scanning everything costs a subprocess over every
     transcript in the store. */
  let sessLimit = 40;
  /* Keyboard cursor into the *visible* rows, -1 when nothing is picked. Filtering
     changes what is visible, so it is reset whenever the filter does. */
  let sessCursor = -1;

  /* Which account the copied commands resume with. A remembered name that has
     since been removed falls back to the active one rather than copying a
     command for a profile that is gone. */
  function sessWho(){
    if (sessTarget && PROFILES.some(p => p.name === sessTarget)) return sessTarget;
    return activeName() || (PROFILES[0] || {}).name || "";
  }
  function cycleSessWho(){
    if (!PROFILES.length) return;
    const names = PROFILES.map(p => p.name);
    const i = names.indexOf(sessWho());
    sessTarget = names[(i + 1) % names.length];
    store.set("sessTarget", sessTarget);
    paintSessions();
  }

  /* Only quote when the shell would care — an unquoted path reads better, and
     most of these are plain. */
  const shq = s => /^[A-Za-z0-9_@%+=:,.\/-]+$/.test(s) ? s : `'${s.replace(/'/g, `'\\''`)}'`;

  /* The active account is reached by bare `claude` — `claudius run` is only how
     you reach a NON-active one, so the command shape follows the target. The cd
     is not decoration: --resume resolves a session against the project it
     belongs to, so the wrong directory finds nothing. */
  function resumeCmd(s, who){
    const inner = who && who !== activeName()
      ? `claudius run ${who} --resume ${s.id}`
      : `claude --resume ${s.id}`;
    return s.cwd ? `cd ${shq(s.cwd)} && ${inner}` : inner;
  }

  const sessAge = t => {
    if (!t) return "—";
    const d = Math.max(0, Math.floor(Date.now() / 1000) - t);
    if (d < 60)    return d + "s";
    if (d < 3600)  return Math.floor(d / 60) + "m";
    if (d < 86400) return Math.floor(d / 3600) + "h";
    return Math.floor(d / 86400) + "d";
  };
  /* The pool is keyed by cwd, so the basename is what distinguishes one row from
     another; the full path is worth having but not worth the width. The home
     directory is the exception — its basename is a username, which in a narrow
     column is indistinguishable from a profile name, so it keeps the `~` the CLI
     already wrote for it. */
  /* A transcript that never recorded a cwd still belongs to a project: the pool is
     keyed by directory, so a sibling row under the same key already knows the path.
     Falling back to the raw key would put `-home-axius-workspace-realizacija` on
     screen — an internal encoding, and one that reads as a different project from
     its own siblings. Memoised on the array identity, so a reload rebuilds it and
     a repaint does not. */
  let dirPaths = { src:null, map:{} };
  function dirPathMap(){
    if (dirPaths.src === SESSIONS) return dirPaths.map;
    const map = {};
    (SESSIONS || []).forEach(s => {
      const k = s.dirkey || "";
      if (k && !map[k] && (s.short || s.cwd)) map[k] = s.short || s.cwd;
    });
    dirPaths = { src:SESSIONS, map };
    return map;
  }
  /* Written the way a person writes it, for the tooltip. */
  const projPath = s => s.short || s.cwd || dirPathMap()[s.dirkey] || "unknown project";
  const projName = s => {
    const p = projPath(s);
    if (p === "~" || p === "unknown project") return p;
    const parts = p.replace(/\/+$/, "").split("/");
    return parts[parts.length - 1] || p;
  };

  /* Only once it is worth knowing: under a megabyte this is noise, and the exact
     byte count never matters. */
  const weightOf = s => {
    const b = Number(s.size) || 0;
    if (b < 1048576) return "";
    const mb = b / 1048576;
    return mb >= 10 ? `${Math.round(mb)}MB` : `${mb.toFixed(1)}MB`;
  };
  const stamp = t => {
    if (!t) return "never";
    try { return new Date(t * 1000).toLocaleString(); }
    catch (e) { return String(t); }
  };

  /* One project per dirkey, labelled by its basename and ordered by how recently
     it was touched — the pool is keyed by directory, so dirkey is the identity
     and the path is only for display. */
  function sessProjects(){
    const seen = new Map();
    (SESSIONS || []).forEach(s => {
      const k = s.dirkey || s.cwd || "";
      const cur = seen.get(k);
      if (cur){ cur.n++; if (s.mts > cur.mts) cur.mts = s.mts; }
      else seen.set(k, { key:k, name:projName(s), path:s.cwd || s.dirkey || "", n:1, mts:s.mts });
    });
    return [...seen.values()].sort((a, b) => b.mts - a.mts);
  }

  /* Substring, case-insensitive, over every field a row actually shows plus the
     id — pasting a session id into the box should find it. */
  function sessMatch(s, q){
    if (!q) return true;
    return [s.label, s.cwd, s.branch, s.id, projName(s), projPath(s)]
      .some(v => v && String(v).toLowerCase().includes(q));
  }
  function visibleSessions(){
    const q = sessQ.trim().toLowerCase();
    return (SESSIONS || []).filter(s =>
      (!sessScope || (s.dirkey || s.cwd || "") === sessScope) && sessMatch(s, q));
  }

  /* Escape first, then wrap: marking up the raw string and escaping afterwards
     would escape the <mark> too, and matching against already-escaped text would
     let a query like "amp" light up inside an entity. */
  function markHits(text, q){
    const s = String(text ?? "");
    if (!q) return esc(s);
    const hay = s.toLowerCase();
    let out = "", i = 0;
    for (;;){
      const at = hay.indexOf(q, i);
      if (at < 0) break;
      out += esc(s.slice(i, at)) + "<mark>" + esc(s.slice(at, at + q.length)) + "</mark>";
      i = at + q.length;
    }
    return out + esc(s.slice(i));
  }

  /* Where a label came from, in the row's tooltip — otherwise a first prompt
     standing in for a title is indistinguishable from one, and you'd wonder why
     some rows read like someone talking. */
  const LSRC_HINT = {
    prompt:"first prompt", last:"last prompt", command:"opening command",
    slug:"session slug", title:"session title",
  };
  const sessLabelHint = s => s.label
    ? `${s.label}${LSRC_HINT[s.lsrc] ? `  ·  ${LSRC_HINT[s.lsrc]}` : ""}`
    : `nothing was said in this session  ·  ${s.id}`;

  /* Quoted for the sources that are someone's words rather than a name. The
     quotes sit outside the highlight so a search never marks punctuation the
     transcript doesn't contain. */
  function sessLabelHTML(s, q){
    if (!s.label) return "empty session";
    const body = markHits(s.label, q);
    return (s.lsrc === "prompt" || s.lsrc === "last")
      ? `<span class="qm">“</span>${body}<span class="qm">”</span>` : body;
  }

  function paintScope(){
    const sel = $("#sessScope"), projects = sessProjects();
    /* A remembered project with nothing left in the pool would filter every row
       away with no way to tell why, so it reverts to everything — but only once
       the pool has actually been read. Before that the list is empty for lack of
       data, and clearing here would drop the preference on every boot. */
    if (SESSIONS != null && sessScope && !projects.some(p => p.key === sessScope)){
      sessScope = "";
      store.set("sessScope", "");
    }
    const total = (SESSIONS || []).length;
    sel.innerHTML = `<option value="">all projects · ${total}</option>` +
      projects.map(p => `<option value="${esc(p.key)}"${p.key === sessScope ? " selected" : ""}
        title="${esc(p.path)}">${esc(p.name)} · ${p.n}</option>`).join("");
    sel.value = sessScope;
    sel.disabled = !total;
  }

  function paintSessions(){
    const who = sessWho();
    $("#sessTargetWho").textContent = who || "no profile";
    $("#sessTargetBtn").hidden = PROFILES.length < 1;
    const body = $("#sessBody"), cnt = $("#sessCnt");
    const filter = $("#sessFilter");
    filter.classList.toggle("has-q", sessQ !== "");
    paintScope();
    if (SESSIONS == null){
      cnt.textContent = "";
      filter.hidden = true;
      body.innerHTML = `<div class="logempty">reading the session pool…</div>`;
      return;
    }
    filter.hidden = !SESSIONS.length;
    if (!SESSIONS.length){
      cnt.textContent = "";
      body.innerHTML = `<div class="logempty">no sessions in the shared pool yet</div>`;
      return;
    }
    const q = sessQ.trim().toLowerCase(), rows = visibleSessions();
    /* Say "N of M" whenever anything is hidden — a filtered count that reads like
       a total is how you conclude sessions went missing. */
    cnt.innerHTML = rows.length === SESSIONS.length
      ? `<b>${SESSIONS.length}</b> shared`
      : `<b>${rows.length}</b> of ${SESSIONS.length}`;
    if (!rows.length){
      body.innerHTML = `<div class="logempty">nothing matches${
        q ? ` “${esc(sessQ.trim())}”` : ""}${sessScope ? " in this project" : ""}</div>`;
      return;
    }
    body.innerHTML = rows.map((s, i) => {
      const cmd = resumeCmd(s, who);
      const gone = s.exists === false;
      /* The command opens with a cd, so a missing directory means it fails on its
         first clause. Still copyable — the directory may be coming back — but the
         row and the tooltip both say so. */
      const cmdHint = gone
        ? `${projPath(s)} no longer exists — this command will fail at the cd`
        : `copy “${cmd}”`;
      return `<div class="srow${gone ? " gone" : ""}${i === sessCursor ? " cur" : ""}"
        data-srow="${esc(s.id)}">
        <span class="age" title="last active ${esc(stamp(s.mts))}">${esc(sessAge(s.mts))}</span>
        <span class="lbl ${s.label ? `src-${esc(s.lsrc || "title")}` : "none"}"
          title="${esc(sessLabelHint(s))}">${sessLabelHTML(s, q)}</span>
        <span class="where" title="${esc(projPath(s))}">${markHits(projName(s), q)}${
          s.branch ? `<span class="br">${markHits(s.branch, q)}</span>` : ""}${
          gone ? `<span class="tag">gone</span>` : ""}</span>
        <span class="wt" title="${esc(s.size ? s.size + " bytes" : "")}">${esc(weightOf(s))}</span>
        <button class="icobtn" data-scopy="${esc(s.id)}"
          title="${esc(cmdHint)}" aria-label="copy resume command">
          <span class="ms">content_copy</span></button>
      </div>`;
    }).join("");
    /* Only offered while the fetch was capped and came back full — that is the
       only time there might be more behind it. */
    if (sessLimit > 0 && SESSIONS.length >= sessLimit)
      body.insertAdjacentHTML("beforeend", `<div class="sessmore">
        <button id="sessAll">show the whole pool</button></div>`);
  }

  /* Arrow keys walk the list and Enter copies, so a search can be finished without
     reaching for the mouse. Clamped rather than wrapping — running off the end of
     a long list by holding a key is worse than stopping at it. */
  function moveSessCursor(delta){
    const rows = visibleSessions();
    if (!rows.length) return;
    const next = sessCursor < 0
      ? (delta > 0 ? 0 : rows.length - 1)
      : Math.min(rows.length - 1, Math.max(0, sessCursor + delta));
    if (next === sessCursor) return;
    sessCursor = next;
    paintSessions();
    const el = $(`[data-srow="${rows[sessCursor].id}"]`);
    if (el) el.scrollIntoView({ block:"nearest" });
  }

  async function loadSessions(quiet){
    try{
      const r = await fetch(`/api/sessions?limit=${sessLimit}`, { cache:"no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      SESSIONS = Array.isArray(data) ? data : [];
      sessCursor = -1;
      paintSessions();
      if (!quiet) log("cache", `read ${SESSIONS.length} shared session${
        SESSIONS.length === 1 ? "" : "s"}${sessLimit ? " (newest first)" : " — the whole pool"}`,
        "free");
    }catch(e){
      SESSIONS = SESSIONS || [];
      paintSessions();
      log("err", `could not read the session pool — ${esc(e.message)}`);
    }
  }

  /* ═══════════ watch cache ════════════════════════════════════════════ */
  const POLL_S = 30, RING = 2 * Math.PI * 11;
  let pollOn = false, pollLeft = POLL_S, pollT = null;
  /* Watching is remembered because it's a working preference, not an action —
     leave it on, come back tomorrow, and the page should still be watching.
     The countdown is not remembered: a reload re-reads the cache anyway, so the
     window starts fresh rather than resuming mid-flight. */
  const pollWanted = () => store.get("watch") === "1";
  function paintRing(){
    const r = $("#pollToggle .rv");
    if (!r) return;
    const frac = pollOn ? (POLL_S - pollLeft) / POLL_S : 0;
    r.style.strokeDashoffset = (RING * (1 - frac)).toFixed(1);
    $("#pollToggle").title = pollOn
      ? `next free cache read in ${pollLeft}s`
      : "Re-read the local cache every 30s — free, no API calls";
  }
  const togglePoll = () => setPoll(!pollOn);
  /* resumed: restoring a remembered state on boot rather than a press now, so
     the log says so and the preference isn't rewritten with what it just read. */
  function setPoll(on, resumed){
    pollOn = on;
    if (!resumed) store.set("watch", pollOn ? "1" : "0");
    $("#pollToggle").setAttribute("aria-checked", String(pollOn));
    pollLeft = POLL_S;
    clearInterval(pollT);
    if (pollOn){
      pollT = setInterval(async () => {
        if (--pollLeft <= 0){
          pollLeft = POLL_S;
          const ok = await load(true);
          if (ok){
            fire("rippling");
            log("cache", `re-read the local cache for ${PROFILES.length} profile${
              PROFILES.length === 1 ? "" : "s"}`);
          }
        }
        paintRing();
      }, 1000);
      log("sys", resumed ? "resumed watching the cache — a free re-read every 30s"
                         : "watching the cache — a free re-read every 30s");
    } else if (!resumed){
      log("sys", "stopped watching the cache");
    }
    paintRing();
  }

  /* ═══════════ wiring ═════════════════════════════════════════════════ */
  document.addEventListener("click", e => {
    if (e.target.closest("#pollToggle")) return togglePoll();
    if (e.target.closest("#logClear")){ LOG.length = 0; paintLog(); return; }
    if (e.target.closest("#sessTargetBtn")) return cycleSessWho();
    if (e.target.closest("#sessQClear")){
      sessQ = "";
      sessCursor = -1;
      $("#sessQ").value = "";
      paintSessions();
      $("#sessQ").focus();
      return;
    }
    if (e.target.closest("#sessAll")){
      sessLimit = 0;                          /* 0 = everything */
      $("#sessAll").disabled = true;
      $("#sessAll").textContent = "reading the whole pool…";
      loadSessions();
      return;
    }
    /* Clicking a row adopts it as the keyboard cursor, so the two ways of moving
       through the list share one position instead of fighting over it. */
    const srow = e.target.closest("[data-srow]");
    if (srow && !e.target.closest("button")){
      sessCursor = visibleSessions().findIndex(s => s.id === srow.dataset.srow);
      paintSessions();
      return;
    }
    if (e.target.closest("#sessReload")){ SESSIONS = null; paintSessions(); loadSessions(); return; }
    const sc = e.target.closest("button[data-scopy]");
    if (sc){
      const s = (SESSIONS || []).find(x => x.id === sc.dataset.scopy);
      if (s) copyCmd(resumeCmd(s, sessWho()), `button[data-scopy="${s.id}"] .ms`);
      return;
    }

    if (e.target.closest("#palBtn")){
      const pop = $("#palPop"), was = pop.classList.contains("on");
      closeMenus();
      if (!was){ pop.classList.add("on"); $("#palQ").focus(); }
      return;
    }
    const cyc = e.target.closest("button[data-cycle]");
    if (cyc){
      const w = cyc.dataset.cycle;
      if (w === "reset"){
        resetMode = MODES[(MODES.indexOf(resetMode) + 1) % MODES.length];
        store.set("resetMode", resetMode);
        renderStage(); paintResets();
      } else {
        cycleLook(w);
        ambFor = null;                       /* the room re-tints with the palette */
        renderStage(); paintResets(); setAmbient(activeProfile() || PROFILES[0], true);
      }
      paintPal();
      return;
    }
    const psel = e.target.closest("button[data-palsel]");
    if (psel){ closeMenus(); activate(psel.dataset.palsel); return; }
    const act = e.target.closest("button[data-act]");
    if (act){
      closeMenus();
      if (act.dataset.act === "all") readAll();
      if (act.dataset.act === "reload") load();
      return;
    }
    const kb = e.target.closest("button[data-kebab]");
    if (kb){
      const m = $(`[data-kmenu="${kb.dataset.kebab}"]`), was = m.classList.contains("on");
      closeMenus();
      if (!was){
        m.classList.add("on");
        /* measure once it's laid out: drop below unless that runs off-screen */
        m.classList.remove("up");
        const r = m.getBoundingClientRect();
        if (r.bottom > innerHeight - 8 && kb.getBoundingClientRect().top > r.height + 16)
          m.classList.add("up");
      }
      return;
    }
    const st = e.target.closest("button[data-style]");
    if (st){
      const [n, i] = st.dataset.style.split(":");
      STYLE[n] = +i; saveStyle();
      closeMenus();
      ambFor = null;
      renderStage(); paintResets();
      if (n === activeName()) setAmbient(activeProfile() || PROFILES[0]);
      return;
    }
    const ka = e.target.closest("button[data-kact]");
    if (ka){
      const [kind, who] = ka.dataset.kact.split(":");
      closeMenus();
      if (kind === "live") return readLive(who);
      if (kind === "copy") return copyRun(who);
      if (kind === "shuffle"){
        const cur = FIELDS.indexOf(fieldFor(who));
        let i; do { i = Math.floor(Math.random() * FIELDS.length); } while (i === cur);
        STYLE[who] = i; saveStyle();
        ambFor = null;
        renderStage(); paintResets();
        if (who === activeName()) setAmbient(activeProfile() || PROFILES[0]);
      }
      return;
    }
    const lv = e.target.closest("button[data-live]");
    if (lv) return readLive(lv.dataset.live);
    const cp = e.target.closest("button[data-copy]");
    if (cp) return copyRun(cp.dataset.copy);
    const sel = e.target.closest("button[data-sel]");
    if (sel) return activate(sel.dataset.sel);

    if (!e.target.closest(".kmenu,.palpop")) closeMenus();
  });

  document.addEventListener("input", e => {
    if (e.target.id === "palQ"){ palQ = e.target.value.trim(); $("#palList").innerHTML = palRows(); }
  });
  /* Both filters reset the cursor: it indexes into what is visible, and what is
     visible just changed underneath it. */
  $("#sessQ").addEventListener("input", e => {
    sessQ = e.target.value; sessCursor = -1; paintSessions();
  });
  $("#sessScope").addEventListener("change", e => {
    sessScope = e.target.value;
    sessCursor = -1;
    store.set("sessScope", sessScope);
    paintSessions();
  });


  document.addEventListener("keydown", e => {
    if (e.key === "Escape"){
      closeMenus();
      /* Escape in the box clears the filter before it does anything else —
         the shortcut that got you there should get you back. */
      if (e.target === $("#sessQ") && sessQ !== ""){
        sessQ = ""; sessCursor = -1; e.target.value = ""; paintSessions();
      }
      return;
    }
    /* The arrows drive the list from the search box (where you already are after
       `/`) or from a row. Anywhere else they still scroll the page. */
    const inList = e.target === $("#sessQ") || (e.target.closest && e.target.closest("[data-srow]"));
    if (inList && (e.key === "ArrowDown" || e.key === "ArrowUp")){
      e.preventDefault();
      moveSessCursor(e.key === "ArrowDown" ? 1 : -1);
      return;
    }
    if (inList && e.key === "Enter"){
      const rows = visibleSessions();
      const s = rows[sessCursor];
      if (s){
        e.preventDefault();
        copyCmd(resumeCmd(s, sessWho()), `button[data-scopy="${s.id}"] .ms`);
      }
      return;
    }
    /* `/` jumps to the search, but not while something already has typing focus,
       or it would eat the slash mid-path. */
    const t = e.target;
    const typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" ||
      t.tagName === "SELECT" || t.isContentEditable);
    if (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey && !e.altKey){
      e.preventDefault();
      $("#sessQ").focus();
      $("#sessQ").select();
    }
  });
  document.addEventListener("pointermove", e => {
    const c = e.target.closest?.(".surface");
    if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", `${((e.clientX - r.left) / r.width * 100).toFixed(1)}%`);
    c.style.setProperty("--my", `${((e.clientY - r.top) / r.height * 100).toFixed(1)}%`);
  }, { passive:true });

  /* tick the live countdowns; the other modes are static so skip them */
  setInterval(() => { if (resetMode === "countdown") paintResets(); }, 1000);

  skeleton();
  paintLog();
  paintRing();
  if (pollWanted()) setPoll(true, true);   /* the pill paints correct on first frame */
  paintSessions();
  load();                                  /* renderAll repaints the rows when it lands */
  loadSessions(true);                      /* the pool doesn't wait on the profile list */
})();
</script>
</body>
</html>
